zh_hans:
  SwordWorld2_5:
    AbyssCurseTable:
      name: 奈洛詛咒表
      items:
        -
          - 「自傷的」　裝備時　該武具的裝備者造成爆擊時，裝備者的HP減少5點。
          - 「悲嘆的」　裝備時　周圍有敵人時，會緊張到淚流不止。戰鬥中無法選取「射程：術者」和「射程：接觸」以外的效果物。
          - 「仁慈的」　裝備時　會對敵人心存憐憫。以敵對角色為對象時，如果對像已經減少了1點以上的HP，則命中力判定、魔法行使判定受到-2的懲罰修正。
          - 「差别的」　裝備時　給予特定分類角色的物理傷害・魔法傷害減少2點。分類由「分類決定表」隨機決定。
          - 「脆弱的」　裝備時　每次受到魔法傷害時，該傷害+1點。
          - 「無謀的」　裝備時　防護點減少2點（最低0）。
        -
          - 「沉重的」　裝備時　被強化的武具的必要力量+2。威力、防護點等保持不變。
          - 「難用的」　裝備時　不管使用哪一行威力表，③④欄的數值都與威力無關地變成「0」（不是自動失敗）。
          - 「軟弱的」　裝備時　精神抵抗力判定受到-1的懲罰修正。
          - 「病弱的」　裝備時　生命抵抗力判定受到-1的懲罰修正。
          - 「過敏的」　裝備時　受到特定屬性的物理傷害、魔法傷害上升2點。屬性由“屬性決定表”隨機決定。
          - 「開朗的」　裝備時　每次在精神抵抗判定中失敗時，就會笑個不停。直到下回合結束時為止，行動判定（‘Ⅰ’123頁）受到-1的懲罰修正。這個效果會累積。
        -
          - 「吞吞吐吐的」　裝備時　說話時容易想不到字或說錯。魔法行使判定受到-1的懲罰修正。
          - 「代為溝通的」　裝備時　自己的話會被武具原封不動地以難以聽清的魔法文明語說出。裝備這款武具時無法使用魔法文明語以外的語言對話，無法行使妖精魔法、魔法法術。
          - 「拒絕施捨的」　裝備時　戰鬥中，接受「抵抗：任意」的效果時，生命抵抗力、精神抵抗力受到-2的懲罰修正直到下回合開始。
          - 「接近死亡的」　攜帶時　生死判定始終受到和「冒險者等級」相同的懲罰修正。
          - 「時髦的」　攜帶時　始終想把該武具裝點得華美。每次獲得收入時，必須花費此收入的1成以上用於裝飾武具（沒有效果之類的變化）。
          - 「吸收瑪那的」　攜帶時　魔法或練技等，以自己的意思使用消耗MP的效果時，所有MP消耗上升1點。
        -
          - 「鈍重的」　攜帶時　移動力變成一半（小數進位）。
          - 「無法決定的」　攜帶時　戰鬥中回合開始時擲1d，出目為「1」則《目標瞄準》及以此為前提的戰鬥特技是為沒有習得。
          - 「錯亂的」　攜帶時　戰鬥中回合開始時擲1d，出目為「1」則使用包含近距離攻擊在內的「射程：接觸」的效果時，物件從和裝備者同位置（區域、座標）的所有角色（包含敵我）中隨機選擇。
          - 「絆腳的」　攜帶時　戰鬥中回合開始時擲1d，出目為「1」則當場跌倒。回合中不能站起來。
          - 「滑落的」　攜帶時　戰鬥中回合開始時擲1d，出目為「1」則手部裝備及拿著的東西全部掉在原地（該回合可以用主動作撿起）。
          - 「放出惡臭的」　攜帶時　散發強烈的惡臭。只是攜帶著就會讓其他角色感到不適，隱蔽判定受到-2的懲罰修正。且冒險者階級（『Ⅱ』137頁）視為低1級。
        -
          - 「醜惡的」　攜帶時　武具外觀醜陋，毫無魅力。販賣該武具時只能賣到基本交易價格的4分之1。且冒險者階級（『Ⅱ』137頁）視為低1級。
          - 「碎念的」　攜帶時　武具中始終響著飛蟲飛舞的聲音。隱蔽判定、危險感知判定受到-4的懲罰修正。
          - 「浸濕的」　攜帶時　武具質感像是吸了水一樣軟塌塌的。追加傷害-2（武器）、防護點-1（鎧、盾）。對疾病屬性的效果的生命抵抗力、精神抵抗力受到-4的懲罰修正。
          - 「舊傷的」　攜帶時　受到回覆HP的效果時（包含因休息造成的回覆），此回覆量減少1點。
          - 「耀眼的」　攜帶時　透過反射光芒等方式發出強烈的光輝。自己始終由於視野不良受到-1的懲罰修正。
          - 「沒有榮耀的」　攜帶時　行為判定自動成功時，視為沒有自動成功，並重投2d，採用新的出目。這個效果1天只生效1次。
        -
          - 「老實人的」　攜帶時　謊言和手段變得很容易暴露。成為真偽判定的對象時，受到-4的懲罰修正。
          - 「暈乘載物的」　攜帶時　對搖晃的抵抗力減弱。以自己步行以外的方式移動10分鐘以​​上後，1小時內行動判定受到-1的懲罰修正。
          - 「討厭綠意的」　攜帶時　在自然環境中會變得無法冷靜。在自然環境（‘Ⅰ’108頁）中行動判定受到-1的懲罰修正。
          - 「無法忍耐的」　攜帶時　遊戲中每次1天開始時，必須花費「冒険者等級×10」加美爾用於興趣和嗜好品等的支出。若處於無法消費興趣和嗜好品的環境中，直到第二天早上為止，HP上限、MP上限減少「冒陝者等級」點。
          - 「糾纏不清的」　攜帶時　這個武具不知不覺就會出現在身邊。以該武具以外的武具進行的命中力判定（武器）、魔法行使判定（武器）、迴避力判定（鎧、盾）會受到-4的懲罰修正。
          - 「慢吞吞的」　攜帶時　戰鬥開始時無法進行「戰鬥準備」。

    AbyssCurseCategoryTable:
      name: 奈洛詛咒分類決定表
      odd: ["蠻族", "動物", "植物", "不死生物", "魔法生物", "在「蠻族」「動物」「植物」「不死生物」「魔法生物」中任選一个"]
      even: ["魔動機", "幻獸", "妖精", "魔神", "人族", "在「魔動機」「幻獸」「妖精」「魔神」「人族」中任選一个"]

    AbyssCurseAttrTable:
      name: 奈洛詛咒屬性決定表
      odd: ["土", "水・冰", "炎", "風", "雷", "纯能量"]
      even: ["斷空", "衝擊", "毒", "疾病", "詛咒", "精神效果"]
